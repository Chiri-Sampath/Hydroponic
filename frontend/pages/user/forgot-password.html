<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgriSmart AI — Reset your account password">
  <title>Forgot Password — AgriSmart AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- AgriSmart AI CSS -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/glass.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="auth-page">
  <div class="glass-card auth-card" style="max-width: 480px;">
    <!-- Logo -->
    <a href="../../index.html" class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <div>
        <div style="font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--text-primary);">
          Agri<span style="color: var(--color-primary);">Smart AI</span>
        </div>
        <div style="font-size: var(--fs-xs); color: var(--text-muted);">Food Production Intelligence</div>
      </div>
    </a>

    <h1 class="auth-title">Reset password</h1>
    <p class="auth-subtitle">Enter your email address to receive password reset instructions</p>

    <!-- Success Alert -->
    <div class="glass-alert glass-alert-success mb-6" id="reset-success" style="display:none;">
      <i data-lucide="check-circle" class="glass-alert-icon"></i>
      <div style="width: 100%;">
        <div id="reset-success-msg" class="font-semibold text-sm">Reset request processed!</div>
        <div id="demo-token-box" class="mt-3" style="display:none; background: rgba(5, 150, 105, 0.08); padding: 12px; border-radius: 8px; border: 1px solid rgba(5, 150, 105, 0.25);">
          <div class="text-xs text-muted mb-2 font-medium">Password Reset Ready:</div>
          <a id="demo-reset-link" href="#" class="glass-btn glass-btn-primary glass-btn-sm w-full justify-center" style="text-decoration:none; font-weight:600;">
            <i data-lucide="key" style="width:14px; height:14px;"></i> Reset Password Now
          </a>
        </div>
      </div>
    </div>

    <!-- Error alert -->
    <div class="glass-alert glass-alert-danger mb-6" id="reset-error" style="display:none;">
      <i data-lucide="alert-circle" class="glass-alert-icon"></i>
      <span id="reset-error-msg">Failed to send reset link.</span>
    </div>

    <form class="auth-form" id="forgot-form" novalidate>
      <!-- Email -->
      <div class="glass-input-group">
        <label class="glass-label" for="email">
          Email address <span class="required">*</span>
        </label>
        <div class="glass-input-icon-wrap">
          <i data-lucide="mail" class="glass-input-icon"></i>
          <input
            id="email"
            name="email"
            type="email"
            class="glass-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>
        <div class="glass-field-error" id="email-error" style="display:none;"></div>
      </div>

      <!-- Submit -->
      <button type="submit" class="glass-btn glass-btn-primary glass-btn-lg" id="forgot-btn" style="width:100%;">
        <span id="forgot-btn-text">Send Reset Instructions</span>
        <span id="forgot-spinner" class="spinner" style="display:none; width:18px; height:18px;"></span>
      </button>
    </form>

    <div class="auth-footer">
      Remember your password?
      <a href="login.html" class="auth-link font-semibold">Back to Sign in</a>
    </div>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/interactive-bg.js"></script>
<script>
  lucide.createIcons();

  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('forgot-btn');
    const spinner = document.getElementById('forgot-spinner');
    const btnText = document.getElementById('forgot-btn-text');
    const errorDiv = document.getElementById('reset-error');
    const errorMsg = document.getElementById('reset-error-msg');
    const successDiv = document.getElementById('reset-success');
    const successMsg = document.getElementById('reset-success-msg');
    const demoTokenBox = document.getElementById('demo-token-box');
    const demoResetLink = document.getElementById('demo-reset-link');

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    demoTokenBox.style.display = 'none';

    const email = document.getElementById('email').value.trim();
    if (!email) {
      errorMsg.textContent = 'Please enter your registered email address.';
      errorDiv.style.display = 'flex';
      return;
    }

    btn.disabled = true;
    btnText.textContent = 'Sending…';
    spinner.style.display = 'block';

    try {
      const result = await AgriAPI.auth.forgotPassword(email);
      successMsg.textContent = result.message || 'If the email is registered, a password reset link has been created.';
      
      const token = result._demo_reset_token || (result.data && result.data.token);
      if (token) {
        demoResetLink.href = `reset-password.html?token=${encodeURIComponent(token)}`;
        demoResetLink.textContent = `Click here to reset password for ${email}`;
        demoTokenBox.style.display = 'block';
      }

      successDiv.style.display = 'flex';
      lucide.createIcons();
    } catch (err) {
      errorMsg.textContent = err.message || 'Unable to process reset request. Please try again.';
      errorDiv.style.display = 'flex';
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Send Reset Instructions';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
