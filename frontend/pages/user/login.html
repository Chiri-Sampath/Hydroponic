<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgriSmart AI — Login to your food production intelligence platform">
  <title>Login — AgriSmart AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- AgriSmart AI CSS -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/glass.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="auth-page">
  <div class="glass-card auth-card" style="max-width: 480px;">
    <!-- Logo -->
    <a href="../../index.html" class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <div>
        <div style="font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--text-primary);">
          Agri<span style="color: var(--color-primary);">Smart AI</span>
        </div>
        <div style="font-size: var(--fs-xs); color: var(--text-muted);">Food Production Intelligence</div>
      </div>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your account to continue</p>


    <!-- Error alert (shown on failed login) -->
    <div class="glass-alert glass-alert-danger mb-6" id="login-error" style="display:none;">
      <i data-lucide="alert-circle" class="glass-alert-icon"></i>
      <span id="login-error-msg">Invalid email or password.</span>
    </div>

    <form class="auth-form" id="login-form" novalidate>
      <!-- Email -->
      <div class="glass-input-group">
        <label class="glass-label" for="email">
          Email address <span class="required">*</span>
        </label>
        <div class="glass-input-icon-wrap">
          <i data-lucide="mail" class="glass-input-icon"></i>
          <input
            id="email"
            name="email"
            type="email"
            class="glass-input"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>
        <div class="glass-field-error" id="email-error" style="display:none;"></div>
      </div>

      <!-- Password -->
      <div class="glass-input-group">
        <label class="glass-label" for="password">
          Password <span class="required">*</span>
        </label>
        <div class="glass-input-icon-wrap" style="position:relative;">
          <i data-lucide="lock" class="glass-input-icon"></i>
          <input
            id="password"
            name="password"
            type="password"
            class="glass-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            style="padding-right: 3rem;"
          >
          <button
            type="button"
            id="toggle-password"
            aria-label="Toggle password visibility"
            style="position:absolute; right: var(--space-4); top: 50%; transform: translateY(-50%);
                   background:none; border:none; color: var(--text-muted); cursor:pointer; display:flex;"
          >
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
        <div class="glass-field-error" id="password-error" style="display:none;"></div>
      </div>

      <!-- Remember / Forgot -->
      <div class="flex items-center justify-between">
        <label style="display:flex; align-items:center; gap:var(--space-2); font-size:var(--fs-sm); color:var(--text-secondary); cursor:pointer;">
          <input type="checkbox" id="remember-me" name="remember"
            style="accent-color: var(--color-primary); width:16px; height:16px;">
          Remember me
        </label>
        <a href="forgot-password.html" class="auth-link" style="font-size:var(--fs-sm); font-weight:600;">
          Forgot password?
        </a>
      </div>

      <!-- Submit -->
      <button type="submit" class="glass-btn glass-btn-primary glass-btn-lg" id="login-btn" style="width:100%;">
        <span id="login-btn-text">Sign in</span>
        <span id="login-spinner" class="spinner" style="display:none; width:18px; height:18px;"></span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="register.html" class="auth-link font-semibold">Create one free</a>
    </div>

    <!-- Attribution -->
    <div style="margin-top: var(--space-8); text-align:center; font-size: var(--fs-xs); color: var(--text-muted);">
      Weather data: <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer"
        style="color: var(--color-accent); text-decoration:none;">Open-Meteo</a> ·
      Geocoding: <a href="https://nominatim.openstreetmap.org" target="_blank" rel="noopener noreferrer"
        style="color: var(--color-accent); text-decoration:none;">OpenStreetMap Nominatim</a>
    </div>
  </div>
</div>

<script src="../../js/config.js?v=3.0.0"></script>
<script src="../../js/api.js?v=3.0.0"></script>
<script src="../../js/auth.js?v=3.0.0"></script>
<script src="../../js/interactive-bg.js?v=3.0.0"></script>
<script>
  // Initialize icons
  lucide.createIcons();


  // Toggle password visibility
  document.getElementById('toggle-password').addEventListener('click', () => {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  });

  // Form submission
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const spinner = document.getElementById('login-spinner');
    const btnText = document.getElementById('login-btn-text');
    const errorDiv = document.getElementById('login-error');
    const errorMsg = document.getElementById('login-error-msg');

    // Clear previous errors
    errorDiv.style.display = 'none';
    document.getElementById('email-error').style.display = 'none';
    document.getElementById('password-error').style.display = 'none';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Basic client-side validation
    let hasError = false;
    if (!email) {
      document.getElementById('email-error').textContent = 'Email is required.';
      document.getElementById('email-error').style.display = 'block';
      document.getElementById('email').classList.add('glass-input-error');
      hasError = true;
    }
    if (!password) {
      document.getElementById('password-error').textContent = 'Password is required.';
      document.getElementById('password-error').style.display = 'block';
      document.getElementById('password').classList.add('glass-input-error');
      hasError = true;
    }
    if (hasError) return;

    // Show loading state
    btn.disabled = true;
    btnText.textContent = 'Signing in…';
    spinner.style.display = 'block';

    try {
      const result = await AgriAPI.auth.login({ email, password });

      if (result.success) {
        // Store tokens
        localStorage.setItem(AgriConfig.TOKEN_KEY, result.access_token);
        localStorage.setItem(AgriConfig.REFRESH_TOKEN_KEY, result.refresh_token);
        localStorage.setItem(AgriConfig.USER_KEY, JSON.stringify(result.user));

        // Redirect based on next param or role
        const nextParam = new URLSearchParams(window.location.search).get('next');
        if (nextParam && !nextParam.includes('login.html')) {
          window.location.href = decodeURIComponent(nextParam);
        } else {
          const role = result.user.role;
          if (role === 'admin') {
            window.location.href = '../admin/dashboard.html';
          } else if (role === 'buyer') {
            window.location.href = '../buyer/dashboard.html';
          } else {
            window.location.href = '../user/dashboard.html';
          }
        }
      } else {
        throw new Error(result.error || 'Login failed. Please check your credentials.');
      }
    } catch (err) {
      errorMsg.textContent = err.message || 'Login failed. Please check your credentials.';
      errorDiv.style.display = 'flex';
      lucide.createIcons();
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Sign in';
      spinner.style.display = 'none';
    }
  });

  // Clear errors on input
  ['email', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(`${id}-error`).style.display = 'none';
      document.getElementById(id).classList.remove('glass-input-error');
    });
  });
</script>
</body>
</html>
