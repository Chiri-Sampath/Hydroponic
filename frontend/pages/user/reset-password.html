<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgriSmart AI — Set a new password for your account">
  <title>Reset Password — AgriSmart AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- AgriSmart AI CSS -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/glass.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
<div class="auth-page">
  <div class="glass-card auth-card" style="max-width: 480px;">
    <!-- Logo -->
    <a href="../../index.html" class="auth-logo">
      <div class="auth-logo-icon">🌱</div>
      <div>
        <div style="font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--text-primary);">
          Agri<span style="color: var(--color-primary);">Smart AI</span>
        </div>
        <div style="font-size: var(--fs-xs); color: var(--text-muted);">Food Production Intelligence</div>
      </div>
    </a>

    <h1 class="auth-title">Set new password</h1>
    <p class="auth-subtitle">Enter your reset token and choose a new secure password</p>

    <!-- Success alert -->
    <div class="glass-alert glass-alert-success mb-6" id="reset-success" style="display:none;">
      <i data-lucide="check-circle" class="glass-alert-icon"></i>
      <span id="reset-success-msg">Password reset successfully! Redirecting to login…</span>
    </div>

    <!-- Error alert -->
    <div class="glass-alert glass-alert-danger mb-6" id="reset-error" style="display:none;">
      <i data-lucide="alert-circle" class="glass-alert-icon"></i>
      <span id="reset-error-msg">Failed to reset password.</span>
    </div>

    <form class="auth-form" id="reset-form" novalidate>
      <!-- Reset Token -->
      <div class="glass-input-group">
        <label class="glass-label" for="token">
          Reset Token <span class="required">*</span>
        </label>
        <div class="glass-input-icon-wrap">
          <i data-lucide="key" class="glass-input-icon"></i>
          <input
            id="token"
            name="token"
            type="text"
            class="glass-input"
            placeholder="e.g. rst_abcd1234"
            required
          >
        </div>
      </div>

      <!-- New Password -->
      <div class="glass-input-group">
        <label class="glass-label" for="new_password">
          New Password <span class="required">*</span> (min. 8 characters)
        </label>
        <div class="glass-input-icon-wrap" style="position:relative;">
          <i data-lucide="lock" class="glass-input-icon"></i>
          <input
            id="new_password"
            name="new_password"
            type="password"
            class="glass-input"
            placeholder="••••••••"
            autocomplete="new-password"
            minlength="8"
            required
            style="padding-right: 3rem;"
          >
          <button
            type="button"
            id="toggle-password"
            aria-label="Toggle password visibility"
            style="position:absolute; right: var(--space-4); top: 50%; transform: translateY(-50%);
                   background:none; border:none; color: var(--text-muted); cursor:pointer; display:flex;"
          >
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="glass-input-group">
        <label class="glass-label" for="confirm_password">
          Confirm New Password <span class="required">*</span>
        </label>
        <div class="glass-input-icon-wrap">
          <i data-lucide="lock" class="glass-input-icon"></i>
          <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            class="glass-input"
            placeholder="••••••••"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="glass-btn glass-btn-primary glass-btn-lg" id="reset-btn" style="width:100%;">
        <span id="reset-btn-text">Reset Password</span>
        <span id="reset-spinner" class="spinner" style="display:none; width:18px; height:18px;"></span>
      </button>
    </form>

    <div class="auth-footer">
      Back to <a href="login.html" class="auth-link font-semibold">Sign in</a>
    </div>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/interactive-bg.js"></script>
<script>
  lucide.createIcons();

  // Auto-fill token from query param if available
  const urlToken = new URLSearchParams(window.location.search).get('token');
  if (urlToken) {
    document.getElementById('token').value = urlToken;
  }

  // Toggle password visibility
  document.getElementById('toggle-password').addEventListener('click', () => {
    const input = document.getElementById('new_password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  });

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reset-btn');
    const spinner = document.getElementById('reset-spinner');
    const btnText = document.getElementById('reset-btn-text');
    const errorDiv = document.getElementById('reset-error');
    const errorMsg = document.getElementById('reset-error-msg');
    const successDiv = document.getElementById('reset-success');
    const successMsg = document.getElementById('reset-success-msg');

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const token = document.getElementById('token').value.trim();
    const new_password = document.getElementById('new_password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    if (!token) {
      errorMsg.textContent = 'Reset token is required.';
      errorDiv.style.display = 'flex';
      return;
    }

    if (!new_password || new_password.length < 8) {
      errorMsg.textContent = 'Password must be at least 8 characters.';
      errorDiv.style.display = 'flex';
      return;
    }

    if (new_password !== confirm_password) {
      errorMsg.textContent = 'Passwords do not match.';
      errorDiv.style.display = 'flex';
      return;
    }

    btn.disabled = true;
    btnText.textContent = 'Resetting…';
    spinner.style.display = 'block';

    try {
      const result = await AgriAPI.auth.resetPassword(token, new_password);
      if (result.success) {
        successMsg.textContent = result.message || 'Password reset successfully! Redirecting…';
        successDiv.style.display = 'flex';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1800);
      } else {
        throw new Error(result.error || 'Reset failed');
      }
    } catch (err) {
      errorMsg.textContent = err.message || 'Failed to reset password. Token may be invalid or expired.';
      errorDiv.style.display = 'flex';
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Reset Password';
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
