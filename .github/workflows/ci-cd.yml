name: AgriSmart AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test Suite & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt


      - name: Run Test Suite
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-12345
          JWT_SECRET_KEY: ci-test-jwt-secret-key-12345
          DATABASE_URL: sqlite:///:memory:
          FRONTEND_URL: http://localhost:5500
          FLASK_ENV: testing
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

